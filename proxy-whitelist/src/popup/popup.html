<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClashMate</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg width="20" height="20" viewBox="0 0 32 32">
        <rect width="32" height="32" rx="7" fill="url(#bg)"/>
        <defs>
          <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#667eea"/>
            <stop offset="100%" style="stop-color:#764ba2"/>
          </linearGradient>
        </defs>
        <g transform="translate(16,16)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
          <circle cx="-5" cy="-3" r="4.5"/>
          <circle cx="5" cy="-3" r="4.5"/>
          <circle cx="0" cy="5" r="4.5"/>
          <line x1="-5" y1="-3" x2="5" y2="-3"/>
          <line x1="-5" y1="-3" x2="0" y2="5"/>
          <line x1="5" y1="-3" x2="0" y2="5"/>
        </g>
      </svg>
      <span>ClashMate</span>
      <span class="version" id="ext-version"></span>
    </div>
  </div>

  <div class="main">
    <!-- 代理开关 -->
    <div class="switch-section">
      <div class="switch-label">代理开关</div>
      <label class="toggle">
        <input type="checkbox" id="proxy-toggle">
        <span class="toggle-slider"></span>
      </label>
    </div>

    <div class="status-text" id="status-text">代理已关闭</div>
    <div class="proxy-state" id="proxy-state" hidden></div>

    <!-- 代理配置：只保留代理地址（协议 SOCKS5 / 端口 7897 固定） -->
    <div class="config-section">
      <div class="section-title">代理配置</div>
      <div class="config-row">
        <label>代理地址</label>
        <input type="text" id="proxy-host" value="127.0.0.1">
      </div>
      <button class="btn-save" id="btn-save">保存配置</button>
    </div>

    <!-- 代理白名单 -->
    <div class="ruleset-section">
      <div class="section-title">代理白名单</div>

      <!-- 白名单文件 -->
      <div class="file-rule-card" id="file-rule-card">
        <div class="file-rule-row">
          <div class="file-rule-info">
            <div class="file-rule-name">📄 rules/proxy-whitelist.txt</div>
            <div class="file-rule-meta" id="file-rule-meta">读取中…</div>
          </div>
          <label class="toggle toggle-sm">
            <input type="checkbox" id="file-rules-toggle" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="file-rule-hint" id="file-rule-hint">编辑 rules/proxy-whitelist.txt 后重开本弹窗即生效</div>
      </div>

      <div class="manual-summary">
        规则合计 <span class="count-badge" id="manual-count">0 条</span>
      </div>

      <!-- 抓取接口域名（v1.2.1）：主按钮抓当前页面（更新CDN等），副按钮抓输入网址；抓取期间全局代理 10 秒 -->
      <input type="text" class="url-input" id="url-input" placeholder="输入网址抓取指定网站（可留空）">
      <button class="btn-fetch-secondary" id="btn-fetch-url">🌐 抓取输入网址</button>
      <button class="btn-fetch" id="btn-fetch-page">🔍 抓取本页接口域名</button>
      <div class="mode-line" id="mode-line"></div>
      <div class="fetch-area" id="fetch-area" hidden></div>
      <button class="btn-save" id="btn-manage">管理全部规则 →</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
