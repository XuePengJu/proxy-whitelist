<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProxyMate</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg width="20" height="20" viewBox="0 0 32 32">
        <rect width="32" height="32" rx="7" fill="url(#bg)"/>
        <defs>
          <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#667eea"/>
            <stop offset="100%" style="stop-color:#764ba2"/>
          </linearGradient>
        </defs>
        <g transform="translate(16,16)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
          <circle cx="-5" cy="-3" r="4.5"/>
          <circle cx="5" cy="-3" r="4.5"/>
          <circle cx="0" cy="5" r="4.5"/>
          <line x1="-5" y1="-3" x2="5" y2="-3"/>
          <line x1="-5" y1="-3" x2="0" y2="5"/>
          <line x1="5" y1="-3" x2="0" y2="5"/>
        </g>
      </svg>
      <span>ProxyMate</span>
      <span class="version">v1.1</span>
    </div>
  </div>

  <div class="main">
    <!-- 代理开关 -->
    <div class="switch-section">
      <div class="switch-label">代理开关</div>
      <label class="toggle">
        <input type="checkbox" id="proxy-toggle">
        <span class="toggle-slider"></span>
      </label>
    </div>

    <div class="status-text" id="status-text">代理已关闭</div>

    <!-- 代理配置 -->
    <div class="config-section">
      <div class="section-title">代理配置</div>
      <div class="config-row">
        <label>协议</label>
        <select id="proxy-scheme">
          <option value="http">HTTP</option>
          <option value="socks5">SOCKS5</option>
        </select>
      </div>
      <div class="config-row">
        <label>地址</label>
        <input type="text" id="proxy-host" value="127.0.0.1" readonly>
      </div>
      <div class="config-row">
        <label>端口</label>
        <input type="number" id="proxy-port" value="7897" min="1" max="65535">
      </div>
      <button class="btn-save" id="btn-save">保存配置</button>
    </div>

    <!-- 规则集：文件 + 手动（v1.1+） -->
    <div class="ruleset-section">
      <div class="section-title">国内域名直连规则集</div>

      <!-- 规则文件 -->
      <div class="file-rule-card" id="file-rule-card">
        <div class="file-rule-row">
          <div class="file-rule-info">
            <div class="file-rule-name">📄 rules/cn-direct.txt</div>
            <div class="file-rule-meta" id="file-rule-meta">读取中…</div>
          </div>
          <label class="toggle toggle-sm">
            <input type="checkbox" id="file-rules-toggle" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="file-rule-hint" id="file-rule-hint">编辑 proxy-mate/rules/cn-direct.txt 后重开本弹窗即生效</div>
      </div>

      <div class="manual-summary">
        规则合计 <span class="count-badge" id="manual-count">0 条</span>
      </div>
      <button class="btn-save" id="btn-manage">管理全部规则 →</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
