<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProxyMate</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg width="20" height="20" viewBox="0 0 32 32">
        <rect width="32" height="32" rx="7" fill="url(#bg)"/>
        <defs>
          <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#667eea"/>
            <stop offset="100%" style="stop-color:#764ba2"/>
          </linearGradient>
        </defs>
        <g transform="translate(16,16)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
          <circle cx="-5" cy="-3" r="4.5"/>
          <circle cx="5" cy="-3" r="4.5"/>
          <circle cx="0" cy="5" r="4.5"/>
          <line x1="-5" y1="-3" x2="5" y2="-3"/>
          <line x1="-5" y1="-3" x2="0" y2="5"/>
          <line x1="5" y1="-3" x2="0" y2="5"/>
        </g>
      </svg>
      <span>ProxyMate</span>
      <span class="version">v1.0</span>
    </div>
  </div>

  <div class="main">
    <!-- 代理开关 -->
    <div class="switch-section">
      <div class="switch-label">代理开关</div>
      <label class="toggle">
        <input type="checkbox" id="proxy-toggle">
        <span class="toggle-slider"></span>
      </label>
    </div>

    <div class="status-text" id="status-text">代理已关闭</div>

    <!-- 代理配置 -->
    <div class="config-section">
      <div class="section-title">代理配置</div>
      <div class="config-row">
        <label>协议</label>
        <select id="proxy-scheme">
          <option value="http">HTTP</option>
          <option value="socks5">SOCKS5</option>
        </select>
      </div>
      <div class="config-row">
        <label>地址</label>
        <input type="text" id="proxy-host" value="127.0.0.1" readonly>
      </div>
      <div class="config-row">
        <label>端口</label>
        <input type="number" id="proxy-port" value="7897" min="1" max="65535">
      </div>
      <button class="btn-save" id="btn-save">保存配置</button>
    </div>

    <!-- 域名白名单 -->
    <div class="bypass-section">
      <div class="section-title">不走代理的域名</div>
      <div class="input-group">
        <input type="text" id="bypass-input" placeholder="输入域名，如 baidu.com" maxlength="128">
        <button class="btn-add" id="btn-add" title="添加">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
      </div>
      <div class="bypass-hint">支持格式: baidu.com / *.baidu.com / 192.168.1.0/24 / &lt;local&gt;</div>
      <div class="bypass-list" id="bypass-list">
        <!-- 动态生成 -->
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
